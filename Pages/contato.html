
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Sempre Doce</title>

    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/contato.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cedarville+Cursive&family=Indie+Flower&display=swap"
        rel="stylesheet">

    <link rel="shortcut icon" href="../img/favicon.png">
</head>

<body>

    <header>
        <div class="div-logo">
            <img class="logotipo"
                src="../img/Logotipo confeitaria bolos delicado rosa .png"
                alt="Logotipo da Confeitaria">
        </div>

        <div class="div-menu">
            <h1>Confeitaria Sempre Doce</h1>

            <nav>
                <ul>
                    <li><a href="../index.html">Início</a></li>
                    <li><a href="sobre.html">Sobre</a></li>
                    <li><a href="cardapio.html">Cardápio</a></li>
                    <li><a href="contato.html">Contato</a></li>
                </ul>
            </nav>
        </div>

        <div class="div-logo"></div>
    </header>

    <main class="contato-container">

        <h2>Faça seu pedido!</h2>
        <p class="introducao">
            Preencha seus dados e faça seu pedido!
        </p>

        <form id="formulario" onsubmit="finalizar(event)">

            <fieldset>
                <legend>Dados pessoais</legend>

                <div class="grade-campos">
                    <div class="campo">
                        <label for="nome">Nome:</label>
                        <input type="text" id="nome" required>
                    </div>

                    <div class="campo">
                        <label for="sobrenome">Sobrenome:</label>
                        <input type="text" id="sobrenome" required>
                    </div>

                    <div class="campo">
                        <label for="email">E-mail:</label>
                        <input type="email" id="email" required>
                    </div>

                    <div class="campo">
                        <label for="telefone">Telefone:</label>
                        <input type="tel" id="telefone" required>
                    </div>
                </div>
            </fieldset>

            <fieldset>
                <legend>Endereço de entrega</legend>

                <div class="grade-campos">

                    <div class="campo">
                        <label for="cep">CEP:</label>
                        <input type="text" id="cep"
                            placeholder="Digite o CEP e aperte Enter"
                            onkeydown="buscar(event)" required>
                    </div>

                    <div class="campo">
                        <label for="uf">UF:</label>
                        <input type="text" id="uf" maxlength="2" required>
                    </div>

                    <div class="campo campo-completo">
                        <label for="logradouro">Logradouro:</label>
                        <input type="text" id="logradouro" required>
                    </div>

                    <div class="campo">
                        <label for="numero">Número:</label>
                        <input type="text" id="numero" required>
                    </div>

                    <div class="campo">
                        <label for="complemento">Complemento (opcional):</label>
                        <input type="text" id="complemento">
                    </div>

                    <div class="campo">
                        <label for="bairro">Bairro:</label>
                        <input type="text" id="bairro" required>
                    </div>

                    <div class="campo">
                        <label for="cidade">Cidade:</label>
                        <input type="text" id="cidade" required>
                    </div>

                    <div class="campo campo-completo">
                        <label for="estado">Estado:</label>
                        <input type="text" id="estado" required>
                    </div>
                </div>
            </fieldset>

            <fieldset>
                <legend>Seu pedido</legend>

                <div id="itens-pedido">

                    <div class="item-pedido">
                        <div class="campo">
                            <label>Produto:</label>
                            <select class="produto" onchange="calcularTotal()">
                                <option value="40">Bolo de morango - R$ 40,00</option>
                                <option value="50">Bolo de chocolate - R$ 50,00</option>
                                <option value="55">Bolo de bombom - R$ 55,00</option>
                                <option value="35">Bolo de limão - R$ 35,00</option>
                                <option value="38">Bolo de maracujá - R$ 38,00</option>
                            </select>
                        </div>

                        <div class="campo">
                            <label>Quantidade:</label>
                            <input type="number" class="quantidade"
                                min="1" value="1" oninput="calcularTotal()" required>
                        </div>

                        <button type="button" class="remover-item"
                            onclick="removerItem(this)">Remover</button>
                    </div>

                </div>

                <button type="button" id="adicionar-item"
                    onclick="adicionarItem()">
                    + Adicionar outro produto
                </button>

                <div class="total-pedido">
                    Total do pedido: <span id="total">R$ 40,00</span>
                </div>
            </fieldset>

            <fieldset>
                <legend>Forma de pagamento</legend>

                <div class="pagamentos">
                    <label><input type="radio" name="pagamento" value="Pix" required> Pix</label>
                    <label><input type="radio" name="pagamento" value="Dinheiro"> Dinheiro</label>
                    <label><input type="radio" name="pagamento" value="Cartão de crédito"> Cartão de crédito</label>
                    <label><input type="radio" name="pagamento" value="Cartão de débito"> Cartão de débito</label>
                </div>
            </fieldset>

            <button type="submit" class="botao-enviar">
                Finalizar pedido
            </button>

            <p id="mensagem"></p>

        </form>
    </main>

    <footer>
        &copy; 2026 Confeitaria Sempre Doce. Todos os direitos reservados.
    </footer>

    <script src="../js/contato.js"></script>

</body>
</html>
